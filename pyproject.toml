[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "arducam-photo"
version = "0.1.0"
description = "Lightweight one-shot photo capture for the Arducam B0494C (108 MP UVC) on Windows"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=2.5.3",
    "opencv-python>=5.0.0.93",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
